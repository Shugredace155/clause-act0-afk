const COLORS = {"Jordan": "#a8e6a1", "Riley": "#7ec8e3", "Sam": "#f0a7a0", "Alex": "#f5d76e", "You": "#e8d5ff"};
let cur = 'start';
const flags = {};
const castEl = document.getElementById('cast');
const speakerEl = document.getElementById('speaker');
const lineEl = document.getElementById('line');
const choicesEl = document.getElementById('choices');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');

function showCast(showJordan=true) {
  const people = [
    ['Riley','#7ec8e3'],['Sam','#f0a7a0'],['Alex','#f5d76e']
  ];
  if (showJordan) people.push(['Jordan','#a8e6a1']);
  castEl.innerHTML = people.map(([n,c]) => `<div class="spr" style="background:${c}">${n}</div>`).join('');
}

function go(id) {
  cur = id;
  const n = NODES[id];
  if (!n) { lineEl.textContent = 'Missing node '+id; return; }
  if (n.type === 'goto') return go(n.to);
  if (n.flags) Object.assign(flags, n.flags);
  choicesEl.innerHTML = '';
  if (n.type === 'end') {
    speakerEl.textContent = '';
    lineEl.textContent = n.text + ' flags=' + JSON.stringify(flags);
    return;
  }
  if (n.type === 'choice') {
    speakerEl.textContent = '';
    lineEl.textContent = n.prompt || '';
    n.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.text;
      b.onclick = () => go(o.to);
      choicesEl.appendChild(b);
    });
    return;
  }
  if (id === 'a0_door_knock' || id === 'a0_door_riley' || id.startsWith('a0_door_pc_')) showCast(false);
  else if (id === 'a0_door_sam_peek' || (!id.startsWith('a0_door_') || ['a0_door_sam_peek','a0_door_jordan_reply','a0_door_alex_aside','a0_door_riley_close'].includes(id))) showCast(true);
  else showCast(true);
  speakerEl.style.color = COLORS[n.speaker] || '#eee';
  speakerEl.textContent = n.speaker || '';
  lineEl.textContent = n.text;
  const cont = document.createElement('button');
  cont.textContent = 'Continue';
  cont.onclick = () => go(n.next);
  choicesEl.appendChild(cont);
}
